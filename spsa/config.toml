# All numeric parameter values use integer UCI wire units.
# iterations=0 requires --iterations N when starting a production run.
version = 1

[paths]
engine = "build/tuning/Tunguska.exe"
cutechess = 'D:\Downloads\cutechess-1.4.0-win64\cutechess-1.4.0-win64\cutechess-cli.exe'
openings = 'D:\Downloads\fastchess-windows-x86-64\fastchess-windows-x86-64\books\UHO_Lichess_4852_v1.epd'
runs = "runs"

[match]
tc = "10+0.1"
threads = 1
hash_mb = 64
concurrency = 1
pairs_per_iteration = 8
startup_timeout = 20
pair_timeout = 600
max_moves = 0
depth = 0

[algorithm]
iterations = 0
alpha = 0.602
gamma = 0.101
A_ratio = 0.1
seed = 20260906

[profiles.search]
selected = ["AspirationDelta", "RFPMargin", "FutilityMargin1", "FutilityMargin2", "FutilityMargin3", "LMRBase", "LMRDivisor", "QDeltaMargin"]

[profiles.pieces]
selected = ["PawnValue", "KnightValue", "BishopValue", "RookValue", "QueenValue"]

[profiles.time]
selected = ["MoveOverhead", "MovesRemainingCap", "MovesRemainingDefault", "TimeIncrement", "TimeMaximumFactor", "TimeOptimumCap", "TimeMaximumCap", "TimeInstabilityCap", "TimeInstabilityFactor", "TimeInstabilityDepth"]

[parameters.AspirationDepth]
